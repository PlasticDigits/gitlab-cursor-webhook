[package]
name = "gitlab-cursor-webhook"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Filter GitLab MR webhooks and forward minimal payloads to Cursor Automations"

[[bin]]
name = "gitlab-cursor-webhook"
path = "src/main.rs"

[lib]
name = "gitlab_cursor_webhook"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
